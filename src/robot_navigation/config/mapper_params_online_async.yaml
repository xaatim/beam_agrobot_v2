slam_toolbox:
  ros__parameters:
    # Sensor settings
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    
    # Mapping settings
    mode: mapping 
    map_update_interval: 1.0
    resolution: 0.05
    transform_publish_period: 0.02
    
    # SLAM algorithms
    linear_update: 0.1
    angular_update: 0.1